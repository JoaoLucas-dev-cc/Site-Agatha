<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171214">
  <meta name="description" content="Uma surpresa feita com carinho para Renata Agatha.">
  <title>Uma surpresa para Agatha</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="page-shell">
    <div class="topline" aria-hidden="true">
      <span class="topline-mark">♥</span>
      <span>feito com carinho</span>
      <span class="topline-mark">♥</span>
    </div>

    <section class="surprise-card" aria-live="polite">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="card-content">
        <div class="heart-icon" aria-hidden="true">♥</div>
        <p class="eyebrow" id="eyebrow">uma surpresa especial</p>
        <h1 id="title">Surpresa para <span>Renata Agatha</span><small>feito por Lucas</small></h1>
        <div id="message-area" class="message-area" hidden>
          <p id="message" class="message"></p>
          <div id="music-area" class="music-area" hidden>
            <p class="music-label">Musiquinha pra curtir:</p>
            <audio controls preload="metadata">
              <source src="Lana-Kamaitachi/lana-kamaitachi.mp3" type="audio/mpeg">
              Seu navegador não conseguiu carregar o áudio. Tente abrir o arquivo lana-kamaitachi.mp3.
            </audio>
          </div>
        </div>
        <div class="card-footer">
          <div class="progress" id="progress" aria-label="Etapa 1 de 4">
            <span class="progress-dot is-active"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
          </div>
          <button class="next-button" id="next-button" type="button">
            <span>Prosseguir</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <p class="signature">um pedacinho do meu carinho para você</p>
  </main>
</body>
</html>
